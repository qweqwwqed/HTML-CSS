<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .grid{
            height: 100vh;
            display: grid;
            grid-template-columns: 3fr 1fr;
            grid-template-rows: 1fr 1fr 0.5fr 0.5fr 1fr 1fr;
            grid-template-areas:
            "header header"
            "section-1 spam-1"
            "section-2 spam-1"
            "section-2 spam-2"
            "section-3 spam-2"
            "footer footer"
        }
        .grid header{
            grid-area: header;
            background: #8D8484;
        }
        .grid section:nth-child(2){
            grid-area: section-1;
            background: #776969;
        }
        .grid section:nth-child(3){
            grid-area: section-2;
            background: #643030;
        }
        .grid section:nth-child(4){
            grid-area: section-3;
            background: #441818;
        }
        .grid aside:nth-child(5){
            grid-area: spam-1;
            background: #937575;
        }
        .grid aside:nth-child(6){
            grid-area: spam-2;
            background: #644C4C;
        }
        .grid footer{
            grid-area: footer;
            background: #BDBDBD;
        }
    </style>
</head>
<body>
<div class="grid">
    <header></header>
    <section></section>
    <section></section>
    <section></section>
    <aside></aside>
    <aside></aside>
    <footer></footer>
</div>
</body>
</html>
